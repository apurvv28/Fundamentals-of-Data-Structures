{% extends "base.html" %}

{% block title %}Login - EventHub{% endblock %}

{% block content %}
<div class="container py-4 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card retro-card mt-lg-5" data-aos="fade-up" data-aos-duration="600">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-3 retro-heading">Welcome <span class="retro-accent">Back</span></h2>
                        <p class="retro-text">Sign in to your EventHub account</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-medium">Username</label>
                            <div class="input-group">
                                <span class="input-group-text retro-input">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" class="form-control retro-input" id="username" name="username" required placeholder="Enter your username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text retro-input">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control retro-input" id="password" name="password" required placeholder="Enter your password">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-dark retro-btn">Sign In</button>
                        </div>

                        <div class="text-center">
                            <p class="retro-text">Don't have an account? 
                                <a href="{{ url_for('register') }}" class="text-decoration-none fw-medium">Create one here</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.input-group-text.retro-input {
    border: 2px solid var(--pure-black);
    border-right: none;
    background: var(--pure-white);
    border-radius: 8px 0 0 8px;
}

.form-control.retro-input {
    border-left: none;
    border-radius: 0 8px 8px 0;
}

.form-control.retro-input:focus {
    border-left: none;
    box-shadow: none;
}

.border.rounded {
    border: 1px solid var(--light-grey) !important;
}
</style>
{% endblock %}
